<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zola AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b141a;
      color: #e9edef;
      display: flex;
      justify-content: center;
      height: 100dvh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      background-color: #111b21;
      height: 100dvh;
    }
    header {
      background-color: #202c33;
      padding: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      border-bottom: 1px solid #2a3942;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.4;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #005c4b;
    }
    .ai {
      align-self: flex-start;
      background-color: #202c33;
    }
    form {
      display: flex;
      padding: 10px;
      gap: 8px;
      background-color: #202c33;
    }
    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #2a3942;
      color: #e9edef;
      font-size: 1rem;
      outline: none;
    }
    button {
      padding: 0 18px;
      border: none;
      border-radius: 20px;
      background-color: #00a884;
      color: #111b21;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="app">
    <header>Zola AI</header>
    <div id="messages"></div>
    <form id="chat-form">
      <input type="text" id="prompt" placeholder="Digite sua mensagem..." autocomplete="off" required>
      <button type="submit" id="send-btn">Enviar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('prompt');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage(prompt, 'user');
      input.value = '';
      sendBtn.disabled = true;

      const loadingMsg = addMessage('Digitando...', 'ai');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        loadingMsg.textContent = data.reply || data.error || 'Sem resposta.';
      } catch {
        loadingMsg.textContent = 'Erro de conexão com o servidor.';
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
